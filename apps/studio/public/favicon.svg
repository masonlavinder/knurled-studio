<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Knurled Studio">
  <!-- Chamfered square with a row of knurl teeth cut into it, redrawing the
       Mark component in SVG because an icon cannot read the token layer. The
       two hex values are the paper and lavinder-600 tokens, and they have to
       be kept in step by hand.

       Three teeth, one row deep, matching the component exactly: the tile is
       a third of the glyph, valleys sit on the half height, and peaks rise
       half a tile above them, which is what makes the cut 45 degrees. A
       second row would draw a hard line across a 16px glyph, so there is not
       one.

       Note: an XML comment cannot contain a double hyphen, so the custom
       properties are named here without their leading dashes. -->
  <defs>
    <clipPath id="chamfer">
      <path d="M8 0H32V24L24 32H0V8Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#chamfer)">
    <rect width="32" height="32" fill="#6B2FA8"/>
    <path d="M0 0H32V10.667L26.667 16L21.333 10.667L16 16L10.667 10.667L5.333 16L0 10.667Z"
          fill="#F4F2EB"/>
  </g>
  <path d="M8 0H32V24L24 32H0V8Z" fill="none" stroke="#6B2FA8" stroke-width="3"/>
</svg>
