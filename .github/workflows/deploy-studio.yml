name: deploy studio

# KS-000 · knurled.studio
#
# Pages is configured with build_type "workflow", so nothing publishes until
# this uploads an artifact. Markdown-only commits (docs, not posts) skip it.

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race for the Pages environment, but let a queued one
# finish rather than cancelling a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Version comes from the packageManager field, so it cannot drift.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A broken commit should fail here, not deploy. Stylelint enforces the
      # design rules, so this gate is what keeps them real.
      - run: pnpm typecheck
      - run: pnpm lint

      - run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
