<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Knurled Studio">
  <!-- Chamfered square, cut top-left and bottom-right, knurled at 45 degrees.
       Hex is inlined because an icon cannot read the token layer. The values
       are the paper and lavinder-600 tokens. Note: an XML comment cannot
       contain a double hyphen, so the custom properties are named without
       their leading dashes here. -->
  <defs>
    <pattern id="knurl" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0 L8 8 M8 0 L0 8" stroke="#6B2FA8" stroke-width="1.25" fill="none"/>
    </pattern>
    <clipPath id="chamfer">
      <path d="M8 0H32V24L24 32H0V8Z"/>
    </clipPath>
  </defs>
  <path d="M8 0H32V24L24 32H0V8Z" fill="#F4F2EB"/>
  <rect width="32" height="32" fill="url(#knurl)" clip-path="url(#chamfer)"/>
  <path d="M8 0H32V24L24 32H0V8Z" fill="none" stroke="#6B2FA8" stroke-width="3"/>
</svg>
